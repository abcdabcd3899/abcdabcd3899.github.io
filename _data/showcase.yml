# Representative Work (homepage showcase)
# Each entry renders as one card with a click-to-play video on the left and a summary on the right.
# Order here = order on the page. Paths are relative to the site root.
#
# Fields:
#   id          anchor id for the card (e.g. /#showcase-datastudio)
#   title       system name
#   subtitle    one-line description
#   kind        small label above the title (e.g. "Product Demo")
#   video       self-hosted MP4 (H.264/AAC, faststart) — loaded only when the visitor clicks play
#   poster      cover image shown before playback
#   duration    shown on the cover, mm:ss
#   language    narration language, shown on the cover
#   scenario    optional one-line demo scenario
#   summary     one paragraph: what the system does
#   highlights  short bullet points; "**text**" renders bold
#   links       optional buttons {label, icon (Font Awesome class), url}

items:
  - id: showcase-datastudio
    title: DataStudio
    subtitle: An LLM-Powered General-Purpose Data Analysis Platform
    kind: Product Demo
    video: ./assets/videos/datastudio-demo.mp4
    poster: ./assets/img/showcase/datastudio-poster.jpg
    duration: "10:31"
    language: Chinese narration
    scenario: "Demo scenario: student daily management at Northwest A&F University (academic warnings, overnight absences, and targeted financial aid over 7 tables: students, colleges, scores, attendance, dorm access, library, and canteen)"
    summary: >-
      DataStudio lets business users ask questions of their data in plain language and get answers they can check.
      A notebook, a drag-and-drop canvas, and natural-language Q&A all read and write one shared analysis graph,
      so a change made in one view shows up in the others. Each question is clarified, broken into steps,
      turned into SQL or Python, checked before it runs, and summarized in a conclusion whose numbers trace back to the source tables.
    highlights:
      - "**12 kinds of data sources**: DuckDB, SQLite, PostgreSQL, Greenplum, MySQL, TiDB, StarRocks, Apache Doris, ClickHouse, Trino/Hive, CSV/Parquet, and Excel uploads; remote databases can be queried directly or synced incrementally to a local copy, and passwords never go into config files."
      - "**Five-level data context (HDC)**: the LLM summarizes columns, tables, relationships, business entities, and the whole database, and the relevant pieces are retrieved when a question is asked."
      - "**Checked before it runs**: generated code passes a safety guardrail, a database EXPLAIN, and a 50-row trial run, and failures are fed back to rewrite it; every number in the conclusion links to its result row and source column."
      - "**84 canvas operators and 100+ algorithms**: 11 operator groups cover cleaning, reshaping, joins, text search, statistics, charts, machine learning, and LLM steps; modeling spans classification and regression through forecasting and survival analysis."
      - "**Reproducible by design**: each step is fingerprinted by its code and upstream inputs, so unchanged results are reused, edits recompute only downstream steps, and every run can be replayed."
      - "**People and agents on one document**: teams co-edit notebooks and canvases in real time with four agents (Q&A, canvas, visualization, review) whose steps can be undone, under OIDC sign-in, three permission levels, row filters, column masking, and a full audit log."
    links: []

  - id: showcase-weavedata
    title: WeaveData
    subtitle: A Multimodal Data Analysis System with Self-Critiquing and Self-Evolving LLM Plans
    kind: Product Demo
    video: ./assets/videos/weavedata-demo.mp4
    poster: ./assets/img/showcase/weavedata-poster.jpg
    duration: "4:20"
    language: Chinese narration
    scenario: "Demo scenarios: linking airlines to their logos (SemBench MMQA) and exploring real-estate listings with photos (Palimpzest)"
    summary: >-
      WeaveData answers natural-language questions that span relational tables, free text, and images.
      The LLM writes a typed logical plan that is checked before it runs, and the result is critiqued afterwards
      to decide whether it actually answers the question. When a plan fails or comes back incomplete,
      WeaveData diagnoses the problem against the real data, repairs the plan, reuses valid intermediate results,
      and records the lesson for future questions.
    highlights:
      - "**Self-critique before execution**: flawed plan drafts are rejected and revised before any data is touched."
      - "**Self-repair after execution**: when the answer is incomplete, the system finds the evidence gap in the actual data and fixes the plan without starting over."
      - "**Inspectable multimodal evidence**: every image or text judgment made by the model is shown alongside its explanation."
      - "**Clarification for ambiguous questions**: a metadata knowledge graph links tables, texts, and images, and the system asks the user to pick an interpretation when a question can be read several ways."
    links:
      - label: Paper
        icon: fas fa-file-pdf
        url: https://arxiv.org/abs/2609.34764
      - label: Code
        icon: fab fa-github
        url: https://github.com/DASE-iDDS/weavedata
      - label: YouTube
        icon: fab fa-youtube
        url: https://youtu.be/MQXFPBQMFEk
      - label: Publication
        icon: fas fa-book-open
        url: "#weavedata"
